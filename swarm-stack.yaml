services:
  stellantis-worker:
    image: ghcr.io/xaoimoon/stellantis:latest
    environment:
      - WORKER_API_KEY=${WORKER_API_KEY}
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
