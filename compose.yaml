services:
  stellantis-worker:
    build: .
    ports:
      - "3000:3000"
    environment:
      - WORKER_API_KEY=${WORKER_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
